name: Nexa Android Verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Show calculated Nexa version
        run: |
          echo "NEXA_VERSION=0.0.0.$(git rev-list --count HEAD)"
      - run: gradle -p apps/android :app:assembleDebug
      - run: node apps/android/verify-phase1.mjs
