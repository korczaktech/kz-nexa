name: Nexa Android Verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Show calculated Nexa version
        run: |
          COMMITS_AFTER_RESET=$(git rev-list --count 6b3c0a21d3ac28b34378d9b4452e966c67dd8f72..HEAD)
          VERSION_NUMBER=$((COMMITS_AFTER_RESET - 2))
          if [ "$VERSION_NUMBER" -lt 2 ]; then VERSION_NUMBER=2; fi
          echo "NEXA_VERSION=0.0.0.${VERSION_NUMBER}"
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace -p apps/android :app:assembleDebug
      - run: node apps/android/verify-phase1.mjs
      - name: Verify Android editor completeness
        run: node apps/android/verify-editor-complete.mjs
