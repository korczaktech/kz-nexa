name: Nexa Phase 1 Verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
