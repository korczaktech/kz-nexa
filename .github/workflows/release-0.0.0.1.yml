name: Nexa First APK Release

on:
  push:
    branches:
      - "release/0.0.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p apps/android :app:assembleDebug
      - name: Verify APK
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk "Korczak-HUB-Nexa-0.0.0.1.apk"
      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.0.0.1 \
            "Korczak-HUB-Nexa-0.0.0.1.apk" \
            --target "${GITHUB_SHA}" \
            --title "Korczak Nexa 0.0.0.1" \
            --notes "Primeira versão do Korczak Nexa. APK Android incluído."
