name: Nexa APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          # Reset the public Nexa sequence after the bad counter-based releases.
          # The first post-reset commit is 0.0.0.2; every later commit increments by one.
          COMMITS_AFTER_RESET=$(git rev-list --count 6b3c0a21d3ac28b34378d9b4452e966c67dd8f72..HEAD)
          VERSION_NUMBER=$((COMMITS_AFTER_RESET - 2))
          if [ "$VERSION_NUMBER" -lt 2 ]; then VERSION_NUMBER=2; fi
          VERSION="0.0.0.${VERSION_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NEXA_VERSION=$VERSION"

      - name: Remove legacy counter releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete 0.0.0.651 --cleanup-tag --yes || true
          gh release delete 0.0.0.652 --cleanup-tag --yes || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p apps/android :app:assembleDebug

      - name: Verify APK
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk "Korczak-HUB-Nexa-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping."
            exit 0
          fi
          gh release create "$VERSION" \
            "Korczak-HUB-Nexa-${VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Korczak Nexa ${VERSION}" \
            --notes "Versão ${VERSION} do Korczak Nexa. APK Android incluído."
