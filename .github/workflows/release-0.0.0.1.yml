name: Nexa APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        shell: bash
        run: |
          # 0.0.0.652 was the bad historical counter-based release.\n          # From this point the sequence is reset to 0.0.0.2 and increments once per commit.\n          COMMITS_AFTER_RESET=$(git rev-list --count 0.0.0.652..HEAD)\n          VERSION="0.0.0.$((COMMITS_AFTER_RESET + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NEXA_VERSION=$VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle -p apps/android :app:assembleDebug

      - name: Verify APK
        run: test -f apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp apps/android/app/build/outputs/apk/debug/app-debug.apk "Korczak-HUB-Nexa-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping."
            exit 0
          fi
          gh release create "$VERSION" \
            "Korczak-HUB-Nexa-${VERSION}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Korczak Nexa ${VERSION}" \
            --notes "Versão ${VERSION} do Korczak Nexa. APK Android incluído."
