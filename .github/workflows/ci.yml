name: Nexa CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: nexa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
