name: Nexa Phase 2 Verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: node apps/web/scripts/verify-phase2.mjs
      - run: node apps/android/verify-phase2.mjs
      - run: node apps/api/dist/verify-phase2.js
      - run: npm test
      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace -p apps/android :app:assembleDebug
